<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatalogTune — Minimalist Accountune Converter</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full text-slate-800 antialiased selection:bg-slate-900 selection:text-white flex flex-col justify-between">

  <div>
    <!-- Navigation Header -->
    <header class="border-b border-slate-200/80 bg-white sticky top-0 z-40">
      <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="h-8 w-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold text-sm shadow-sm">
            CT
          </div>
          <span class="font-bold text-base text-slate-900 tracking-tight">CatalogTune</span>
        </div>

        <div class="flex items-center gap-2 text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>Accountune Import Engine Ready</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-xl mx-auto px-6 py-12 w-full">

      <!-- Notification Banner -->
      <div id="error-box" class="hidden mb-6 bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-xs font-medium flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-500"></i>
          <span id="error-message">Extraction Error.</span>
        </div>
        <button onclick="hideError()" class="text-rose-500 hover:text-rose-800">Dismiss</button>
      </div>

      <!-- Upload Card -->
      <div id="upload-card" class="bg-white rounded-2xl border border-slate-200/80 p-8 text-center shadow-sm">
        <div id="drop-area" class="group cursor-pointer flex flex-col items-center justify-center py-8 px-4 transition">
          <div class="h-12 w-12 rounded-2xl bg-slate-100 text-slate-600 flex items-center justify-center mb-4 group-hover:bg-slate-900 group-hover:text-white transition-all duration-300 shadow-sm">
            <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
          </div>
          <h2 class="text-base font-semibold text-slate-900 mb-1">Upload Catalog PDF</h2>
          <p class="text-xs text-slate-500 max-w-sm mb-6">Drop your Godrej price list PDF to convert to an Accountune Excel file</p>
          
          <button class="bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs px-5 py-2.5 rounded-xl transition shadow-sm">
            Select & Convert PDF
          </button>
          <input type="file" id="file-input" accept="application/pdf" class="hidden">
        </div>

        <!-- Processing Indicator -->
        <div id="loading" class="hidden py-8 space-y-3">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-900 border-t-transparent"></div>
          <p class="text-xs font-medium text-slate-700">Extracting tables across all pages natively...</p>
        </div>
      </div>

    </main>
  </div>

  <footer class="py-5 text-center text-xs text-slate-400 border-t border-slate-200/60 bg-white">
    CatalogTune — Fast, Compliant Accountune Import Generation
  </footer>

  <script>
    lucide.createIcons();

    const fileInput = document.getElementById('file-input');
    const dropArea = document.getElementById('drop-area');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('error-box');
    const errorMessage = document.getElementById('error-message');

    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if (e.target.files.length) uploadFile(e.target.files[0]); });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      errorBox.classList.add('hidden');
    }

    async function uploadFile(file) {
      hideError();
      dropArea.classList.add('hidden');
      loading.classList.remove('hidden');

      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];

        try {
          const response = await fetch('/.netlify/functions/process-catalog', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileBase64: base64 })
          });

          const data = await response.json();

          if (!response.ok || data.error) {
            throw new Error(data.error || 'Extraction failed');
          }

          // Trigger Direct File Download
          const link = document.createElement('a');
          link.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + data.excelBase64;
          link.download = 'Accountune_Bulk_Import_Master.xlsx';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

        } catch (err) {
          showError(err.message);
        } finally {
          loading.classList.add('hidden');
          dropArea.classList.remove('hidden');
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
